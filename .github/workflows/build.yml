name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: so
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            ext: so
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            ext: dylib
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            ext: dylib
          - runner: windows-latest
            goos: windows
            goarch: amd64
            ext: dll

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Resolve dependencies
        shell: bash
        run: go mod tidy

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath -buildmode=c-shared -ldflags "-s -w" -o "dist/codex-auto-ping.${{ matrix.ext }}" .
          rm -f dist/*.h

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-auto-ping-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/codex-auto-ping.${{ matrix.ext }}
          if-no-files-found: error
