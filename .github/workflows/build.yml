name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: so
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: so
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            ext: dylib
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            ext: dylib
          - runner: windows-latest
            goos: windows
            goarch: amd64
            ext: dll
          - runner: windows-latest
            goos: windows
            goarch: arm64
            ext: dll

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install cross compiler (Linux arm64)
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          case "${GOOS}-${GOARCH}" in
            linux-amd64)
              export CC=gcc
              ;;
            linux-arm64)
              export CC=aarch64-linux-gnu-gcc
              ;;
          esac
          CGO_ENABLED=1 go build -trimpath -buildmode=c-shared -ldflags "-s -w" -o "dist/codex-auto-ping.${{ matrix.ext }}" .
          rm -f dist/*.h

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-auto-ping-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/codex-auto-ping.${{ matrix.ext }}
          if-no-files-found: error
