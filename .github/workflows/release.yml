name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build musl plugin
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "${REF_TYPE}" == "tag" ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="${REF_NAME#release/v}"
          fi

          mkdir -p package dist
          docker buildx build \
            --platform "linux/${ARCH}" \
            --file Dockerfile.plugin \
            --output type=local,dest=package \
            .
          ASSET="codex-auto-ping_${VERSION}_linux_${ARCH}.zip"
          python -m zipfile -c "dist/${ASSET}" package/codex-auto-ping.so
          python -m zipfile -l "dist/${ASSET}"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: codex-auto-ping-linux-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  build-desktop:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            os: darwin
            arch: amd64
            ext: dylib
          - runner: macos-latest
            os: darwin
            arch: arm64
            ext: dylib
          - runner: windows-latest
            os: windows
            arch: amd64
            ext: dll

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and package plugin
        shell: bash
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "${REF_TYPE}" == "tag" ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="${REF_NAME#release/v}"
          fi

          mkdir -p package dist
          LIB="codex-auto-ping.${EXT}"
          ASSET="codex-auto-ping_${VERSION}_${OS}_${ARCH}.zip"

          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --config Release --parallel
          if [[ "${OS}" == "windows" ]]; then
            cp "build/Release/codex-auto-ping.dll" "package/${LIB}"
          else
            cp "build/codex-auto-ping.${EXT}" "package/${LIB}"
          fi

          (
            cd package
            python -m zipfile -c "../dist/${ASSET}" "${LIB}"
          )

          python -m zipfile -l "dist/${ASSET}"

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: codex-auto-ping-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-linux, build-desktop]
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "${REF_TYPE}" == "tag" ]]; then
            TAG="${REF_NAME}"
          else
            TAG="v${REF_NAME#release/v}"
          fi
          echo "RELEASE_TAG=${TAG}" >> "${GITHUB_ENV}"

      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.zip | sort -k 2 > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/checksums.txt
