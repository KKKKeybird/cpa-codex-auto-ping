name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: so
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            ext: so
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            ext: dylib
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            ext: dylib
          - runner: windows-latest
            goos: windows
            goarch: amd64
            ext: dll
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            ext: dll

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Resolve dependencies
        shell: bash
        run: go mod tidy

      - name: Build plugin
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          mkdir -p package dist
          LIB="codex-auto-ping.${EXT}"
          ASSET="codex-auto-ping_${VERSION}_${GOOS}_${GOARCH}.zip"

          CGO_ENABLED=1 go build \
            -trimpath \
            -buildmode=c-shared \
            -ldflags "-s -w -X main.pluginVersion=${VERSION}" \
            -o "package/${LIB}" .

          rm -f package/*.h

          python -m zipfile -c "dist/${ASSET}" "package/${LIB}"
          python - <<'PY'
import os, zipfile
asset = next(os.path.join("dist", name) for name in os.listdir("dist") if name.endswith(".zip"))
with zipfile.ZipFile(asset) as z:
    names = z.namelist()
    expected = "codex-auto-ping." + os.environ["EXT"]
    # python -m zipfile preserves the source path, so rewrite if needed.
    if names != [expected]:
        data = z.read(names[0])
        z.close()
        os.remove(asset)
        with zipfile.ZipFile(asset, "w", compression=zipfile.ZIP_DEFLATED) as out:
            out.writestr(expected, data)
PY

          python - <<'PY'
import os, zipfile
asset = next(os.path.join("dist", name) for name in os.listdir("dist") if name.endswith(".zip"))
with zipfile.ZipFile(asset) as z:
    expected = "codex-auto-ping." + os.environ["EXT"]
    assert z.namelist() == [expected], (asset, z.namelist())
PY

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: codex-auto-ping-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.zip | sort -k 2 > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/checksums.txt
