[package]
name = "codex-auto-ping"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/KKKKeybird/cpa-codex-auto-ping"

[lib]
name = "codex_auto_ping"
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
